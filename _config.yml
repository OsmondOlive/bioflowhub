###########################################################
### BioFlowHub - _config.yml
### Health & Wellness Blog by Leonardo Olivieri Carvalho
### Powered by Beautiful Jekyll | GitHub Pages
###########################################################

############################
# --- Required options --- #
############################

title: BioFlowHub
author: Leonardo Olivieri Carvalho
url: "https://bioflowhub.com"
baseurl: ""

###############################################
# --- List of links in the navigation bar --- #
###############################################

navbar-links:
  Health Tips:
    - Nutrition & Diet: "tags#nutrition"
    - Sleep & Recovery: "tags#sleep"
    - Stress Management: "tags#stress"
    - Immune System: "tags#immunity"
    - Gut Health: "tags#gut-health"
  Fitness & Movement:
    - Exercise Basics: "tags#exercise"
    - Stretching & Mobility: "tags#stretching"
    - Home Workouts: "tags#home-workouts"
  Biomedical Insights:
    - How the Body Works: "tags#biomedical"
    - Understanding Lab Tests: "tags#lab-tests"
    - Evidence-Based Health: "tags#evidence-based"
  Recommended: "recommended/"
  About: "aboutme/"
  Contact: "contact/"
  Privacy Policy: "privacypolicy/"

################
# --- Logo --- #
################

round-avatar: false
title-img: "/assets/img/bioflowhub-logo.svg"
favicon: "/assets/img/favicon-32x32.png"

#####################################
# --- Footer social media links --- #
#####################################

social-network-links:
  email: "contact@bioflowhub.com"
  github: "OsmondOlive"
  twitter: "LeonardoC23116"
  linkedin: "leonardo-carvalho-8a960728"
  rss: true

rss-description: "Evidence-based health tips, biomedical insights, and wellness strategies — written by a biomedical scientist."

###########################
# --- General options --- #
###########################

share-links-active:
  twitter: true
  facebook: true
  linkedin: true
  vk: false

url-pretty: "bioflowhub.com"

excerpt_length: 55
feed_show_excerpt: true
feed_show_tags: true
post_search: true
edit_page_button: false
navbar-var-length: true

keywords: "health tips, wellness, nutrition, biomedical, evidence-based health, gut health, immune system, sleep, stress management, fitness, home workouts, lab tests, healthy lifestyle, bioflowhub"

######################################
# --- Colours / background image --- #
######################################

navbar-col: "#1a2e2a"
navbar-text-col: "#e8f5e9"
navbar-border-col: "#2e7d5e"
page-col: "#f8faf9"
text-col: "#1c2b27"
link-col: "#2e7d5e"
hover-col: "#52b788"
footer-col: "#1a2e2a"
footer-text-col: "#b7dbc8"
footer-link-col: "#74c69d"
footer-hover-col: "#d8f3dc"

site-css:
  - "/assets/css/bioflowhub-custom.css"

site-js:
  - "/assets/js/bioflowhub-effects.js"

#################################
# --- Web Analytics Section --- #
#################################

gtag: "G-F6DJKSMT6E"

####################
# --- Comments --- #
####################

utterances:
  repository: "OsmondOlive/bioflowhub"
  issue-term: title
  theme: github-light
  label: blog-comments

################
# --- Misc --- #
################

show-date: true
date_format: "%B %-d, %Y"
timezone: "America/Sao_Paulo"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
paginate: 6

kramdown:
  input: GFM

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true
      social-share: true
  -
    scope:
      path: ""
    values:
      layout: "page"
      permalink: /:title/

exclude:
  - CHANGELOG.md
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
  - docs/

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag
