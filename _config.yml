############################
# --- Required options --- #
############################

title: BioFlowHub
author: Leonardo Olivieri Carvalho

###############################################
# --- List of links in the navigation bar --- #
###############################################

navbar-links:
  Health Tips:
    - Nutrition & Diet: "nutrition"
    - Sleep & Recovery: "sleep"
    - Stress Management: "stress"
    - Immune System: "immunity"
    - Gut Health: "gut-health"
  Fitness & Movement:
    - Exercise Basics: "exercise-basics"
    - Stretching & Mobility: "stretching"
    - Home Workouts: "home-workouts"
  Biomedical Insights:
    - How the Body Works: "how-body-works"
    - Understanding Lab Tests: "lab-tests"
    - Evidence-Based Health: "evidence-based"
  Recommended: "recommended"
  About: "aboutme"
  Privacy Policy: "privacypolicy"

################
# --- Logo --- #
################

round-avatar: false

title-img: "/assets/img/bioflowhub-logo.png"

favicon: "/assets/img/favicon-32x32.png"

#####################################
# --- Footer social media links --- #
#####################################

social-network-links:
  email: "stonelion777@gmail.com"
  github: "OsmondOlive"
  rss: true
  # Adicione quando tiver:
  # instagram: seuusuario
  # youtube: seucanal
  # linkedin: seuusuario

rss-description: "Evidence-based health tips, biomedical insights, and wellness strategies — written by a biomedical scientist."

###########################
# --- General options --- #
###########################

share-links-active:
  twitter: true
  facebook: true
  linkedin: true
  vk: false

url-pretty: "bioflowhub.com"

excerpt_length: 55
feed_show_excerpt: true
feed_show_tags: true
post_search: true
edit_page_button: false
navbar-var-length: true

keywords: "health tips, wellness, nutrition, biomedical, evidence-based health, gut health, immune system, sleep, stress management, fitness, home workouts, lab tests, healthy lifestyle, bioflowhub"

######################################
# --- Colours / background image --- #
######################################

# Paleta BioFlowHub — verde natureza + branco limpo + acento teal
# Transmite: saúde, confiança, ciência, leveza

navbar-col: "#1a2e2a"           # Verde escuro sofisticado
navbar-text-col: "#e8f5e9"      # Branco esverdeado
navbar-border-col: "#2e7d5e"    # Verde médio
page-col: "#f8faf9"             # Fundo quase branco com toque verde
text-col: "#1c2b27"             # Texto escuro (leitura confortável)
link-col: "#2e7d5e"             # Verde teal — links
hover-col: "#52b788"            # Verde mais vibrante no hover
footer-col: "#1a2e2a"           # Mesmo que navbar
footer-text-col: "#b7dbc8"      # Verde claro
footer-link-col: "#74c69d"      # Verde médio claro
footer-hover-col: "#d8f3dc"     # Verde muito claro no hover

# Imagem de fundo no footer (opcional — comente se não quiser)
# footer-img: "/assets/img/footer_bg.png"

# CSS customizado com animações e hover effects
site-css:
  - "/assets/css/bioflowhub-custom.css"

# JS customizado com efeitos suaves
site-js:
  - "/assets/js/bioflowhub-effects.js"

#################################
# --- Web Analytics Section --- #
#################################

# Cole seu ID do Google Analytics aqui (formato G-XXXXXXXXXX)
google_analytics: "G-FB1TX9TM1M"

# Google Tag Manager (opcional)
# gtm: "GTM-XXXXXXX"

# AdSense — cole o script no arquivo _includes/head.html após aprovação:
# <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
# Coloque anúncios apenas em posições estratégicas:
# 1) Após o 2º parágrafo dos posts
# 2) No final dos posts (antes dos comentários)
# 3) Sidebar (se o tema suportar)
# EVITE: banners no topo, popups, mais de 3 anúncios por página

####################
# --- Comments --- #
####################

# Utterances — mais simples que Giscus, usa GitHub Issues
# PASSO A PASSO:
# 1. Vá em https://github.com/apps/utterances e instale no repo bioflowhub
# 2. Habilite Issues no repositório (Settings > Features > Issues ✅)
# 3. Preencha os campos abaixo e descomente:

utterances:
  repository: "OsmondOlive/bioflowhub"
  issue-term: title
  theme: github-light
  label: blog-comments

################
# --- Misc --- #
################

show-date: false
date_format: "%B %-d, %Y"
timezone: "America/Sao_Paulo"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
paginate: 6

kramdown:
  input: GFM

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true
      social-share: true
  -
    scope:
      path: ""
    values:
      layout: "page"

exclude:
  - CHANGELOG.md
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
  - docs/

plugins:
  - jekyll-paginate
  - jekyll-sitemap
