<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Adolescent brain development imbalance</title>
<desc>Diagram showing two brain regions during adolescence: the reward system, which is fully reactive, and the prefrontal cortex, which is only about 60 percent mature and does not finish developing until the mid-20s.</desc>

<rect x="60" y="40" width="560" height="240" rx="24" fill="#f8faf9" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="90" y="68" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="500" fill="#1a2e2a">Adolescent brain</text>

<rect x="100" y="100" width="220" height="140" rx="12" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text x="210" y="128" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Reward system</text>
<text x="210" y="148" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">Nucleus accumbens</text>
<rect x="120" y="165" width="180" height="16" rx="4" fill="#D85A30" stroke="none"/>
<text x="210" y="205" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">Fully reactive</text>

<rect x="360" y="100" width="220" height="140" rx="12" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="470" y="128" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Prefrontal cortex</text>
<text x="470" y="148" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">Judgment, impulse control</text>
<rect x="380" y="165" width="180" height="16" rx="4" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<rect x="380" y="165" width="108" height="16" rx="4" fill="#378ADD" stroke="none"/>
<text x="470" y="205" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">~60% mature, completes mid-20s</text>
</svg>
