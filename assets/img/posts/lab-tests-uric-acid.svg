<svg viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <rect width="820" height="420" fill="#f8faf9" rx="12"/>

  <!-- Title block -->
  <text x="410" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2e2a">Uric Acid and the Metabolic Cluster</text>
  <text x="410" y="52" text-anchor="middle" font-size="11" fill="#666">Hyperuricemia does not occur in isolation. It clusters with other metabolic markers in a self-reinforcing cycle.</text>

  <!-- Horizontal separator -->
  <line x1="40" y1="64" x2="780" y2="64" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Central uric acid circle — pushed down to y=220 -->
  <circle cx="410" cy="220" r="62" fill="#fff3e0" stroke="#ff9800" stroke-width="2.5"/>
  <text x="410" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2e2a">Elevated</text>
  <text x="410" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#ff9800">Uric Acid</text>
  <text x="410" y="244" text-anchor="middle" font-size="9" fill="#666">&gt;7 mg/dL men</text>
  <text x="410" y="256" text-anchor="middle" font-size="9" fill="#666">&gt;6 mg/dL women</text>

  <defs>
    <marker id="arrowRed2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e57373"/>
    </marker>
    <marker id="arrowOrange2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ff9800"/>
    </marker>
    <marker id="arrowBlue2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1976d2"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7b1fa2"/>
    </marker>
  </defs>

  <!-- Node 1: Insulin resistance (top) — y=80 -->
  <rect x="285" y="80" width="250" height="46" rx="8" fill="#fff" stroke="#e57373" stroke-width="1.5"/>
  <text x="410" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">Insulin Resistance</text>
  <text x="410" y="116" text-anchor="middle" font-size="10" fill="#555">Reduces renal uric acid excretion</text>
  <!-- Bidirectional arrows -->
  <line x1="415" y1="126" x2="415" y2="156" stroke="#e57373" stroke-width="1.5" marker-end="url(#arrowRed2)"/>
  <line x1="405" y1="156" x2="405" y2="126" stroke="#ff9800" stroke-width="1.5" marker-end="url(#arrowOrange2)"/>

  <!-- Node 2: Hypertension (right) — x=600 y=160 -->
  <rect x="600" y="160" width="190" height="46" rx="8" fill="#fff" stroke="#1976d2" stroke-width="1.5"/>
  <text x="695" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">Hypertension</text>
  <text x="695" y="196" text-anchor="middle" font-size="10" fill="#555">Renin-angiotensin activation</text>
  <line x1="600" y1="193" x2="474" y2="210" stroke="#1976d2" stroke-width="1.5" marker-end="url(#arrowBlue2)"/>

  <!-- Node 3: High Triglycerides (bottom right) — y=290 -->
  <rect x="560" y="290" width="220" height="46" rx="8" fill="#fff" stroke="#ff9800" stroke-width="1.5"/>
  <text x="670" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">High Triglycerides</text>
  <text x="670" y="326" text-anchor="middle" font-size="10" fill="#555">Fructose drives both TG and UA</text>
  <line x1="570" y1="296" x2="464" y2="256" stroke="#ff9800" stroke-width="1.5" marker-end="url(#arrowOrange2)"/>

  <!-- Node 4: Low HDL (bottom left) — y=290 -->
  <rect x="40" y="290" width="220" height="46" rx="8" fill="#fff" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="150" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a148c">Low HDL</text>
  <text x="150" y="326" text-anchor="middle" font-size="10" fill="#555">Shared metabolic driver</text>
  <line x1="255" y1="296" x2="358" y2="256" stroke="#7b1fa2" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

  <!-- Node 5: Gout (left) — y=160 -->
  <rect x="30" y="160" width="210" height="46" rx="8" fill="#fff" stroke="#e53935" stroke-width="1.5"/>
  <text x="135" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#b71c1c">Gout and Joint Damage</text>
  <text x="135" y="196" text-anchor="middle" font-size="10" fill="#555">Urate crystal deposition</text>
  <line x1="242" y1="193" x2="348" y2="213" stroke="#e53935" stroke-width="1.5"/>

  <!-- Dietary drivers box -->
  <rect x="30" y="355" width="760" height="44" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="1"/>
  <text x="410" y="372" text-anchor="middle" font-size="10" font-weight="bold" fill="#e65100">Primary dietary drivers of elevated uric acid:</text>
  <text x="410" y="388" text-anchor="middle" font-size="10" fill="#555">Fructose (sugar-sweetened beverages) · Alcohol · Red meat · Organ meats · Seafood · Diuretic medications</text>

  <text x="410" y="412" text-anchor="middle" font-size="9.5" fill="#aaa">bioflowhub.com</text>
</svg>
