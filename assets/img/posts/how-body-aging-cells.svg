<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <rect width="820" height="400" fill="#f8faf9" rx="12"/>
  <text x="410" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2e2a">Four Key Hallmarks of Biological Aging</text>
  <text x="410" y="54" text-anchor="middle" font-size="11" fill="#666">All are measurable. All are influenced by lifestyle. None are inevitable at their current rate.</text>

  <!-- Hallmark 1: Telomere Shortening -->
  <rect x="20" y="72" width="185" height="240" rx="10" fill="#fff" stroke="#7b1fa2" stroke-width="1.5"/>
  <rect x="20" y="72" width="185" height="10" rx="10" fill="#7b1fa2"/>
  <rect x="20" y="78" width="185" height="4" fill="#7b1fa2"/>
  <text x="112" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2e2a">Telomere Shortening</text>

  <!-- Telomere diagram -->
  <rect x="55" y="118" width="115" height="16" rx="4" fill="#ce93d8"/>
  <rect x="55" y="118" width="18" height="16" rx="4" fill="#7b1fa2"/>
  <rect x="152" y="118" width="18" height="16" rx="4" fill="#7b1fa2"/>
  <text x="112" y="130" text-anchor="middle" font-size="8" fill="#4a148c">Young cell — long telomeres</text>

  <rect x="55" y="144" width="115" height="16" rx="4" fill="#e1bee7"/>
  <rect x="55" y="144" width="12" height="16" rx="4" fill="#9c27b0"/>
  <rect x="158" y="144" width="12" height="16" rx="4" fill="#9c27b0"/>
  <text x="112" y="156" text-anchor="middle" font-size="8" fill="#6a1b9a">Middle age — shortening</text>

  <rect x="55" y="170" width="115" height="16" rx="4" fill="#f3e5f5"/>
  <rect x="55" y="170" width="6" height="16" rx="4" fill="#ab47bc"/>
  <rect x="164" y="170" width="6" height="16" rx="4" fill="#ab47bc"/>
  <text x="112" y="182" text-anchor="middle" font-size="8" fill="#7b1fa2">Old cell — critically short</text>

  <line x1="40" y1="196" x2="190" y2="196" stroke="#e0e0e0" stroke-width="1"/>
  <text x="112" y="212" text-anchor="middle" font-size="9.5" fill="#333">Chromosomes shorten</text>
  <text x="112" y="226" text-anchor="middle" font-size="9.5" fill="#333">with each cell division.</text>
  <text x="112" y="240" text-anchor="middle" font-size="9.5" fill="#333">Stress, inflammation,</text>
  <text x="112" y="254" text-anchor="middle" font-size="9.5" fill="#333">and oxidative damage</text>
  <text x="112" y="268" text-anchor="middle" font-size="9.5" fill="#333">accelerate the process.</text>
  <text x="112" y="290" text-anchor="middle" font-size="9" fill="#7b1fa2" font-style="italic">Modifiable: exercise,</text>
  <text x="112" y="303" text-anchor="middle" font-size="9" fill="#7b1fa2" font-style="italic">sleep, stress reduction</text>

  <!-- Hallmark 2: Mitochondrial Dysfunction -->
  <rect x="215" y="72" width="185" height="240" rx="10" fill="#fff" stroke="#e65100" stroke-width="1.5"/>
  <rect x="215" y="72" width="185" height="10" rx="10" fill="#e65100"/>
  <rect x="215" y="78" width="185" height="4" fill="#e65100"/>
  <text x="307" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2e2a">Mitochondrial</text>
  <text x="307" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2e2a">Dysfunction</text>

  <!-- Mitochondria efficiency diagram -->
  <text x="307" y="142" text-anchor="middle" font-size="9" fill="#555">Young mitochondria:</text>
  <rect x="235" y="148" width="144" height="12" rx="3" fill="#ff8f00"/>
  <rect x="235" y="148" width="130" height="12" rx="3" fill="#ffb300"/>
  <text x="307" y="158" text-anchor="middle" font-size="7" fill="#fff">90% efficient ATP output</text>

  <text x="307" y="175" text-anchor="middle" font-size="9" fill="#555">Aged mitochondria:</text>
  <rect x="235" y="181" width="144" height="12" rx="3" fill="#ffe0b2"/>
  <rect x="235" y="181" width="65" height="12" rx="3" fill="#ff9800"/>
  <text x="267" y="191" text-anchor="middle" font-size="7" fill="#fff">45%</text>
  <text x="310" y="191" text-anchor="middle" font-size="7" fill="#bf360c">+ ↑ ROS damage</text>

  <line x1="230" y1="202" x2="385" y2="202" stroke="#e0e0e0" stroke-width="1"/>
  <text x="307" y="218" text-anchor="middle" font-size="9.5" fill="#333">Less ATP produced,</text>
  <text x="307" y="232" text-anchor="middle" font-size="9.5" fill="#333">more reactive oxygen</text>
  <text x="307" y="246" text-anchor="middle" font-size="9.5" fill="#333">species generated.</text>
  <text x="307" y="260" text-anchor="middle" font-size="9.5" fill="#333">Cellular damage</text>
  <text x="307" y="274" text-anchor="middle" font-size="9.5" fill="#333">accumulates in tissues.</text>
  <text x="307" y="296" text-anchor="middle" font-size="9" fill="#e65100" font-style="italic">Modifiable: aerobic</text>
  <text x="307" y="309" text-anchor="middle" font-size="9" fill="#e65100" font-style="italic">exercise, diet quality</text>

  <!-- Hallmark 3: Cellular Senescence -->
  <rect x="410" y="72" width="185" height="240" rx="10" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
  <rect x="410" y="72" width="185" height="10" rx="10" fill="#1565c0"/>
  <rect x="410" y="78" width="185" height="4" fill="#1565c0"/>
  <text x="502" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2e2a">Cellular Senescence</text>
  <text x="502" y="115" text-anchor="middle" font-size="10" fill="#555">"Zombie cells"</text>

  <!-- Senescent cell diagram -->
  <ellipse cx="502" cy="158" rx="50" ry="38" fill="#fff8e1" stroke="#f57f17" stroke-width="2" stroke-dasharray="5,3"/>
  <ellipse cx="502" cy="155" rx="18" ry="14" fill="#ffe082" stroke="#f57f17" stroke-width="1"/>
  <text x="502" y="159" text-anchor="middle" font-size="8" fill="#e65100">DNA</text>
  <text x="502" y="170" text-anchor="middle" font-size="8" fill="#e65100">damage</text>
  <!-- Secretion arrows -->
  <line x1="552" y1="148" x2="572" y2="138" stroke="#e53935" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <line x1="555" y1="160" x2="578" y2="160" stroke="#e53935" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <line x1="552" y1="172" x2="572" y2="182" stroke="#e53935" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <defs><marker id="arrowR" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#e53935"/></marker></defs>
  <text x="578" y="160" font-size="8" fill="#e53935">SASP</text>

  <line x1="425" y1="202" x2="578" y2="202" stroke="#e0e0e0" stroke-width="1"/>
  <text x="502" y="218" text-anchor="middle" font-size="9.5" fill="#333">Damaged cells that</text>
  <text x="502" y="232" text-anchor="middle" font-size="9.5" fill="#333">stop dividing but keep</text>
  <text x="502" y="246" text-anchor="middle" font-size="9.5" fill="#333">secreting inflammatory</text>
  <text x="502" y="260" text-anchor="middle" font-size="9.5" fill="#333">signals (SASP) that</text>
  <text x="502" y="274" text-anchor="middle" font-size="9.5" fill="#333">damage neighbors.</text>
  <text x="502" y="296" text-anchor="middle" font-size="9" fill="#1565c0" font-style="italic">Modifiable: caloric</text>
  <text x="502" y="309" text-anchor="middle" font-size="9" fill="#1565c0" font-style="italic">restriction, exercise</text>

  <!-- Hallmark 4: Chronic Inflammation -->
  <rect x="605" y="72" width="195" height="240" rx="10" fill="#fff" stroke="#e53935" stroke-width="2"/>
  <rect x="605" y="72" width="195" height="10" rx="10" fill="#e53935"/>
  <rect x="605" y="78" width="195" height="4" fill="#e53935"/>
  <text x="702" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2e2a">Chronic Inflammation</text>
  <text x="702" y="115" text-anchor="middle" font-size="10" fill="#555">"Inflammaging"</text>

  <!-- Inflammation cycle -->
  <circle cx="702" cy="162" r="40" fill="none" stroke="#e53935" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="702" y="142" text-anchor="middle" font-size="8" fill="#e53935">Aging</text>
  <text x="740" y="167" font-size="8" fill="#e53935">Inflam-</text>
  <text x="740" y="179" font-size="8" fill="#e53935">mation</text>
  <text x="702" y="198" text-anchor="middle" font-size="8" fill="#e53935">Senescence</text>
  <text x="648" y="167" text-anchor="middle" font-size="8" fill="#e53935">Tissue</text>
  <text x="648" y="179" text-anchor="middle" font-size="8" fill="#e53935">damage</text>
  <text x="702" y="166" text-anchor="middle" font-size="9" fill="#c62828">cycle</text>

  <line x1="622" y1="210" x2="792" y2="210" stroke="#e0e0e0" stroke-width="1"/>
  <text x="702" y="226" text-anchor="middle" font-size="9.5" fill="#333">Persistent low-grade</text>
  <text x="702" y="240" text-anchor="middle" font-size="9.5" fill="#333">inflammation drives</text>
  <text x="702" y="254" text-anchor="middle" font-size="9.5" fill="#333">cardiovascular disease,</text>
  <text x="702" y="268" text-anchor="middle" font-size="9.5" fill="#333">diabetes, cancer, and</text>
  <text x="702" y="282" text-anchor="middle" font-size="9.5" fill="#333">neurodegeneration.</text>
  <text x="702" y="304" text-anchor="middle" font-size="9" fill="#e53935" font-style="italic">Modifiable: diet, sleep,</text>
  <text x="702" y="317" text-anchor="middle" font-size="9" fill="#e53935" font-style="italic">exercise, stress control</text>

  <!-- Bottom note -->
  <rect x="20" y="322" width="780" height="34" rx="8" fill="#f0f9f4" stroke="#2e7d5e" stroke-width="1"/>
  <text x="410" y="337" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a2e2a">The encouraging finding from aging research:</text>
  <text x="410" y="351" text-anchor="middle" font-size="10.5" fill="#333">Every one of these hallmarks is significantly influenced by lifestyle. The rate of biological aging is not fixed.</text>

  <text x="410" y="388" text-anchor="middle" font-size="9.5" fill="#aaa">Based on López-Otín et al., Cell 2013 and 2023 · bioflowhub.com</text>
</svg>
