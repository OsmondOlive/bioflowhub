<svg width="680" height="280" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Gate control theory of pain</title>
<desc>Diagram showing how a fast touch signal from massaging the skin partially closes a gate in the spinal cord, reducing how much of the slower pain signal reaches the brain.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#3a4a45" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="40" y="110" width="100" height="70" rx="10" fill="#f8faf9" stroke="#888780" stroke-width="0.5"/>
<text x="90" y="138" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#1a2e2a">Skin</text>
<text x="90" y="158" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5f5e5a">Massage applied</text>

<text x="145" y="98" text-anchor="start" font-family="sans-serif" font-size="12" fill="#5f5e5a">Touch signal</text>
<path d="M140 132 Q220 110 298 116" fill="none" stroke="#1D9E75" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

<text x="145" y="232" text-anchor="start" font-family="sans-serif" font-size="12" fill="#5f5e5a">Pain signal</text>
<path d="M140 165 Q220 195 298 206" fill="none" stroke="#D85A30" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>

<rect x="300" y="70" width="130" height="160" rx="12" fill="#f8faf9" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="365" y="142" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#1a2e2a">Spinal cord</text>
<text x="365" y="160" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5f5e5a">Dorsal horn gate</text>

<path d="M430 158 L493 158" fill="none" stroke="#D85A30" stroke-width="1" stroke-opacity="0.55" stroke-linecap="round" marker-end="url(#arrow)"/>

<rect x="495" y="113" width="135" height="90" rx="10" fill="#f0eefe" stroke="#7F77DD" stroke-width="0.5"/>
<text x="562" y="148" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Brain</text>
<text x="562" y="168" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">Dampened pain signal</text>
</svg>
