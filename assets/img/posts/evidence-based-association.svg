<svg viewBox="0 0 820 320" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <rect width="820" height="320" fill="#f8faf9" rx="12"/>
  <text x="410" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2e2a">Association vs. Causation</text>
  <text x="410" y="54" text-anchor="middle" font-size="11" fill="#666">Three reasons two things can be correlated without one causing the other</text>

  <!-- Box 1: Direct causation -->
  <rect x="20" y="72" width="240" height="200" rx="10" fill="#fff" stroke="#2e7d5e" stroke-width="2"/>
  <rect x="20" y="72" width="240" height="10" rx="10" fill="#2e7d5e"/>
  <rect x="20" y="78" width="240" height="4" fill="#2e7d5e"/>
  <text x="140" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2e2a">Real causation</text>
  <circle cx="100" cy="165" r="28" fill="#c8e6c9" stroke="#2e7d5e" stroke-width="2"/>
  <text x="100" y="169" text-anchor="middle" font-size="10" fill="#1b5e20">Exercise</text>
  <circle cx="200" cy="165" r="28" fill="#c8e6c9" stroke="#2e7d5e" stroke-width="2"/>
  <text x="200" y="169" text-anchor="middle" font-size="10" fill="#1b5e20">Lower CVD</text>
  <line x1="130" y1="165" x2="170" y2="165" stroke="#2e7d5e" stroke-width="2" marker-end="url(#green)"/>
  <defs>
    <marker id="green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2e7d5e"/></marker>
    <marker id="orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#ff9800"/></marker>
    <marker id="red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#e53935"/></marker>
  </defs>
  <text x="140" y="220" text-anchor="middle" font-size="9.5" fill="#333">A directly causes B.</text>
  <text x="140" y="234" text-anchor="middle" font-size="9.5" fill="#333">This is what headlines</text>
  <text x="140" y="248" text-anchor="middle" font-size="9.5" fill="#333">usually imply.</text>
  <text x="140" y="264" text-anchor="middle" font-size="9" fill="#2e7d5e" font-style="italic">Needs RCT to confirm</text>

  <!-- Box 2: Confounding -->
  <rect x="290" y="72" width="240" height="200" rx="10" fill="#fff" stroke="#ff9800" stroke-width="2"/>
  <rect x="290" y="72" width="240" height="10" rx="10" fill="#ff9800"/>
  <rect x="290" y="78" width="240" height="4" fill="#ff9800"/>
  <text x="410" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2e2a">Confounding</text>
  <circle cx="410" cy="135" r="24" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <text x="410" y="139" text-anchor="middle" font-size="9" fill="#e65100">Healthy</text>
  <text x="410" y="150" text-anchor="middle" font-size="9" fill="#e65100">lifestyle</text>
  <circle cx="360" cy="200" r="24" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="360" y="204" text-anchor="middle" font-size="9" fill="#e65100">Vegetables</text>
  <circle cx="460" cy="200" r="24" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="460" y="204" text-anchor="middle" font-size="9" fill="#e65100">Longevity</text>
  <line x1="393" y1="153" x2="372" y2="177" stroke="#ff9800" stroke-width="1.5" marker-end="url(#orange)"/>
  <line x1="427" y1="153" x2="447" y2="177" stroke="#ff9800" stroke-width="1.5" marker-end="url(#orange)"/>
  <line x1="384" y1="200" x2="434" y2="200" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="410" y="244" text-anchor="middle" font-size="9.5" fill="#333">A and B are correlated</text>
  <text x="410" y="258" text-anchor="middle" font-size="9.5" fill="#333">because C causes both.</text>
  <text x="410" y="272" text-anchor="middle" font-size="9" fill="#ff9800" font-style="italic">Very common in nutrition research</text>

  <!-- Box 3: Reverse causation -->
  <rect x="560" y="72" width="240" height="200" rx="10" fill="#fff" stroke="#e53935" stroke-width="2"/>
  <rect x="560" y="72" width="240" height="10" rx="10" fill="#e53935"/>
  <rect x="560" y="78" width="240" height="4" fill="#e53935"/>
  <text x="680" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2e2a">Reverse causation</text>
  <circle cx="630" cy="165" r="28" fill="#ffebee" stroke="#e53935" stroke-width="2"/>
  <text x="630" y="165" text-anchor="middle" font-size="9" fill="#c62828">Low</text>
  <text x="630" y="177" text-anchor="middle" font-size="9" fill="#c62828">activity</text>
  <circle cx="730" cy="165" r="28" fill="#ffebee" stroke="#e53935" stroke-width="2"/>
  <text x="730" y="165" text-anchor="middle" font-size="9" fill="#c62828">Poor</text>
  <text x="730" y="177" text-anchor="middle" font-size="9" fill="#c62828">health</text>
  <line x1="700" y1="158" x2="662" y2="158" stroke="#e53935" stroke-width="2" marker-end="url(#red)"/>
  <text x="680" y="220" text-anchor="middle" font-size="9.5" fill="#333">B causes A, not the</text>
  <text x="680" y="234" text-anchor="middle" font-size="9.5" fill="#333">other way around.</text>
  <text x="680" y="248" text-anchor="middle" font-size="9.5" fill="#333">Sick people exercise</text>
  <text x="680" y="262" text-anchor="middle" font-size="9.5" fill="#333">less because they are sick.</text>
  <text x="680" y="278" text-anchor="middle" font-size="9" fill="#e53935" font-style="italic">Common in cross-sectional data</text>

  <text x="410" y="308" text-anchor="middle" font-size="9.5" fill="#aaa">bioflowhub.com</text>
</svg>
