<svg viewBox="0 0 820 380" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <rect width="820" height="380" fill="#f8faf9" rx="12"/>

  <text x="410" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2e2a">Homocysteine: Metabolism and Cardiovascular Risk</text>
  <text x="410" y="56" text-anchor="middle" font-size="11" fill="#666">Three B vitamins regulate the two pathways that clear homocysteine. Deficiency in any raises plasma levels.</text>

  <!-- Central homocysteine box -->
  <rect x="310" y="120" width="200" height="70" rx="10" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <text x="410" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a2e2a">Homocysteine</text>
  <text x="410" y="166" text-anchor="middle" font-size="10" fill="#666">Intermediate of methionine</text>
  <text x="410" y="180" text-anchor="middle" font-size="10" fill="#666">metabolism</text>

  <!-- Pathway 1: Remethylation (left) -->
  <rect x="40" y="120" width="200" height="70" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
  <text x="140" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2e2a">Remethylation</text>
  <text x="140" y="164" text-anchor="middle" font-size="10" fill="#555">Converts back to methionine</text>
  <text x="140" y="178" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e7d5e">Requires: B12 + Folate</text>

  <!-- Arrow from Hcy to remethylation -->
  <line x1="310" y1="155" x2="242" y2="155" stroke="#ff9800" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <defs>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ff9800"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e53935"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4caf50"/>
    </marker>
  </defs>

  <!-- Pathway 2: Transsulfuration (right) -->
  <rect x="580" y="120" width="200" height="70" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
  <text x="680" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2e2a">Transsulfuration</text>
  <text x="680" y="164" text-anchor="middle" font-size="10" fill="#555">Converts to cysteine</text>
  <text x="680" y="178" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565c0">Requires: Vitamin B6</text>

  <!-- Arrow from Hcy to transsulfuration -->
  <line x1="510" y1="155" x2="578" y2="155" stroke="#ff9800" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- When elevated: consequences box -->
  <rect x="140" y="240" width="540" height="90" rx="10" fill="#ffebee" stroke="#e53935" stroke-width="1.5"/>
  <text x="410" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">When homocysteine accumulates</text>
  <line x1="160" y1="270" x2="660" y2="270" stroke="#ffcdd2" stroke-width="1"/>

  <!-- Three consequences -->
  <text x="243" y="289" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">Endothelial damage</text>
  <text x="243" y="303" text-anchor="middle" font-size="10" fill="#555">Impairs nitric oxide</text>
  <text x="243" y="316" text-anchor="middle" font-size="10" fill="#555">and vessel integrity</text>

  <text x="410" y="289" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">Oxidative stress</text>
  <text x="410" y="303" text-anchor="middle" font-size="10" fill="#555">Promotes LDL oxidation</text>
  <text x="410" y="316" text-anchor="middle" font-size="10" fill="#555">and inflammation</text>

  <text x="577" y="289" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">Pro-thrombotic state</text>
  <text x="577" y="303" text-anchor="middle" font-size="10" fill="#555">Activates platelets and</text>
  <text x="577" y="316" text-anchor="middle" font-size="10" fill="#555">clotting factors</text>

  <!-- Vertical dividers inside consequence box -->
  <line x1="325" y1="272" x2="325" y2="325" stroke="#ffcdd2" stroke-width="1"/>
  <line x1="495" y1="272" x2="495" y2="325" stroke="#ffcdd2" stroke-width="1"/>

  <!-- Arrow from central box to consequences -->
  <line x1="410" y1="190" x2="410" y2="238" stroke="#e53935" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>

  <!-- Risk levels strip -->
  <rect x="40" y="73" width="740" height="32" rx="6" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="110" y="87" text-anchor="middle" font-size="10" font-weight="bold" fill="#4caf50">Normal</text>
  <text x="110" y="100" text-anchor="middle" font-size="10" fill="#4caf50">&lt;10 µmol/L</text>
  <line x1="200" y1="73" x2="200" y2="105" stroke="#e0e0e0" stroke-width="1"/>
  <text x="290" y="87" text-anchor="middle" font-size="10" font-weight="bold" fill="#ff9800">Intermediate</text>
  <text x="290" y="100" text-anchor="middle" font-size="10" fill="#ff9800">10–15 µmol/L</text>
  <line x1="380" y1="73" x2="380" y2="105" stroke="#e0e0e0" stroke-width="1"/>
  <text x="470" y="87" text-anchor="middle" font-size="10" font-weight="bold" fill="#e57373">Elevated</text>
  <text x="470" y="100" text-anchor="middle" font-size="10" fill="#e57373">15–30 µmol/L</text>
  <line x1="560" y1="73" x2="560" y2="105" stroke="#e0e0e0" stroke-width="1"/>
  <text x="650" y="87" text-anchor="middle" font-size="10" font-weight="bold" fill="#e53935">Severe</text>
  <text x="650" y="100" text-anchor="middle" font-size="10" fill="#e53935">&gt;30 µmol/L</text>

  <text x="410" y="360" text-anchor="middle" font-size="9.5" fill="#aaa">bioflowhub.com</text>
</svg>
