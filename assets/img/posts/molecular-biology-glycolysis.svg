<svg viewBox="0 0 680 1020" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
<rect width="680" height="1020" fill="#f8f9fa" rx="12"/>
<rect width="680" height="1020" fill="none" stroke="#dee2e6" stroke-width="1" rx="12"/>
<defs>
  <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#546e7a"/>
  </marker>
  <marker id="arr-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
  </marker>
  <marker id="arr-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
  </marker>
</defs>
<text x="340" y="38" text-anchor="middle" font-size="20" font-weight="600" fill="#1a1a2e">Glycolysis</text>
<text x="340" y="58" text-anchor="middle" font-size="12" fill="#6c757d">Glucose breakdown: 10 enzymatic steps in the cytoplasm</text>
<line x1="60" y1="70" x2="620" y2="70" stroke="#dee2e6" stroke-width="1"/>
<rect x="40" y="80" width="600" height="24" rx="6" fill="#ffcdd2"/>
<text x="340" y="97" text-anchor="middle" font-size="12" font-weight="600" fill="#b71c1c">ENERGY INVESTMENT PHASE (Steps 1-5) — consumes 2 ATP</text>
<rect x="40" y="544" width="600" height="24" rx="6" fill="#c8e6c9"/>
<text x="340" y="561" text-anchor="middle" font-size="12" font-weight="600" fill="#1b5e20">ENERGY PAYOFF PHASE (Steps 6-10) — produces 4 ATP + 2 NADH</text>
<rect x="90" y="112" width="480" height="38" rx="8" fill="#ffebee" stroke="#e57373" stroke-width="1.5"/>
<circle cx="118" cy="132" r="13" fill="#e57373"/>
<text x="118" y="137" text-anchor="middle" font-size="12" font-weight="700" fill="white">1</text>
<text x="270" y="129" text-anchor="middle" font-size="13" font-weight="600" fill="#212121">Glucose</text>
<text x="270" y="145" text-anchor="middle" font-size="10" fill="#546e7a">C6H12O6</text>
<line x1="340" y1="151" x2="340" y2="175" stroke="#90a4ae" stroke-width="2" marker-end="url(#arr-red)"/>
<rect x="90" y="176" width="480" height="38" rx="8" fill="#ffebee" stroke="#e57373" stroke-width="1.5"/>
<circle cx="118" cy="196" r="13" fill="#e57373"/>
<text x="118" y="201" text-anchor="middle" font-size="12" font-weight="700" fill="white">2</text>
<text x="270" y="193" text-anchor="middle" font-size="13" font-weight="600" fill="#212121">Glucose-6-phosphate</text>
<text x="270" y="209" text-anchor="middle" font-size="10" fill="#546e7a">-1 ATP</text>
<line x1="340" y1="215" x2="340" y2="239" stroke="#90a4ae" stroke-width="2" marker-end="url(#arr-red)"/>
<rect x="355" y="219" width="100" height="17" rx="4" fill="white" stroke="#b0bec5" stroke-width="1"/>
<text x="405" y="232" text-anchor="middle" font-size="10" fill="#37474f" font-style="italic">Hexokinase</text>
<rect x="90" y="240" width="480" height="38" rx="8" fill="#ffebee" stroke="#e57373" stroke-width="1.5"/>
<circle cx="118" cy="260" r="13" fill="#e57373"/>
<text x="118" y="265" text-anchor="middle" font-size="12" font-weight="700" fill="white">3</text>
<text x="270" y="257" text-anchor="middle" font-size="13" font-weight="600" fill="#212121">Fructose-6-phosphate</text>
<line x1="340" y1="279" x2="340" y2="303" stroke="#90a4ae" stroke-width="2" marker-end="url(#arr-red)"/>
<rect x="355" y="283" width="154" height="17" rx="4" fill="white" stroke="#b0bec5" stroke-width="1"/>
<text x="432" y="296" text-anchor="middle" font-size="10" fill="#37474f" font-style="italic">Phosphoglucose isomerase</text>
<rect x="90" y="304" width="480" height="38" rx="8" fill="#ffebee" stroke="#e57373" stroke-width="1.5"/>
<circle cx="118" cy="324" r="13" fill="#e57373"/>
<text x="118" y="329" text-anchor="middle" font-size="12" font-weight="700" fill="white">4</text>
<text x="270" y="321" text-anchor="middle" font-size="13" font-weight="600" fill="#212121">Fructose-1,6-bisphosphate</text>
<text x="270" y="337" text-anchor="middle" font-size="10" fill="#546e7a">-1 ATP  |  key control</text>
<line x1="340" y1="343" x2="340" y2="367" stroke="#90a4ae" stroke-width="2" marker-end="url(#arr-red)"/>
<rect x="355" y="347" width="136" height="17" rx="4" fill="white" stroke="#b0bec5" stroke-width="1"/>
<text x="423" y="360" text-anchor="middle" font-size="10" fill="#37474f" font-style="italic">Phosphofructokinase-1</text>
<rect x="90" y="368" width="480" height="38" rx="8" fill="#ffebee" stroke="#e57373" stroke-width="1.5"/>
<circle cx="118" cy="388" r="13" fill="#e57373"/>
<text x="118" y="393" text-anchor="middle" font-size="12" font-weight="700" fill="white">5</text>
<text x="270" y="385" text-anchor="middle" font-size="13" font-weight="600" fill="#212121">DHAP + G3P</text>
<text x="270" y="401" text-anchor="middle" font-size="10" fill="#546e7a">molecule splits in 2</text>
<line x1="340" y1="407" x2="340" y2="431" stroke="#90a4ae" stroke-width="2" marker-end="url(#arr-red)"/>
<rect x="355" y="411" width="100" height="17" rx="4" fill="white" stroke="#b0bec5" stroke-width="1"/>
<text x="405" y="424" text-anchor="middle" font-size="10" fill="#37474f" font-style="italic">Aldolase</text>
<rect x="90" y="432" width="480" height="38" rx="8" fill="#ffebee" stroke="#e57373" stroke-width="1.5"/>
<circle cx="118" cy="452" r="13" fill="#e57373"/>
<text x="118" y="457" text-anchor="middle" font-size="12" font-weight="700" fill="white">6</text>
<text x="270" y="449" text-anchor="middle" font-size="13" font-weight="600" fill="#212121">Glyceraldehyde-3-P (x2)</text>
<rect x="90" y="578" width="480" height="38" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
<circle cx="118" cy="598" r="13" fill="#66bb6a"/>
<text x="118" y="603" text-anchor="middle" font-size="12" font-weight="700" fill="white">7</text>
<text x="270" y="595" text-anchor="middle" font-size="13" font-weight="600" fill="#212121">1,3-Bisphosphoglycerate</text>
<text x="270" y="611" text-anchor="middle" font-size="10" fill="#546e7a">+2 NADH</text>
<line x1="340" y1="617" x2="340" y2="641" stroke="#90a4ae" stroke-width="2" marker-end="url(#arr-green)"/>
<rect x="355" y="621" width="112" height="17" rx="4" fill="white" stroke="#b0bec5" stroke-width="1"/>
<text x="411" y="634" text-anchor="middle" font-size="10" fill="#37474f" font-style="italic">G3P dehydrogenase</text>
<rect x="90" y="642" width="480" height="38" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
<circle cx="118" cy="662" r="13" fill="#66bb6a"/>
<text x="118" y="667" text-anchor="middle" font-size="12" font-weight="700" fill="white">8</text>
<text x="270" y="659" text-anchor="middle" font-size="13" font-weight="600" fill="#212121">3-Phosphoglycerate</text>
<text x="270" y="675" text-anchor="middle" font-size="10" fill="#546e7a">+2 ATP</text>
<line x1="340" y1="681" x2="340" y2="705" stroke="#90a4ae" stroke-width="2" marker-end="url(#arr-green)"/>
<rect x="355" y="685" width="148" height="17" rx="4" fill="white" stroke="#b0bec5" stroke-width="1"/>
<text x="429" y="698" text-anchor="middle" font-size="10" fill="#37474f" font-style="italic">Phosphoglycerate kinase</text>
<rect x="90" y="706" width="480" height="38" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
<circle cx="118" cy="726" r="13" fill="#66bb6a"/>
<text x="118" y="731" text-anchor="middle" font-size="12" font-weight="700" fill="white">9</text>
<text x="270" y="723" text-anchor="middle" font-size="13" font-weight="600" fill="#212121">2-Phosphoglycerate</text>
<line x1="340" y1="745" x2="340" y2="769" stroke="#90a4ae" stroke-width="2" marker-end="url(#arr-green)"/>
<rect x="355" y="749" width="148" height="17" rx="4" fill="white" stroke="#b0bec5" stroke-width="1"/>
<text x="429" y="762" text-anchor="middle" font-size="10" fill="#37474f" font-style="italic">Phosphoglycerate mutase</text>
<rect x="90" y="770" width="480" height="38" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
<circle cx="118" cy="790" r="13" fill="#66bb6a"/>
<text x="118" y="795" text-anchor="middle" font-size="12" font-weight="700" fill="white">10</text>
<text x="270" y="787" text-anchor="middle" font-size="13" font-weight="600" fill="#212121">Phosphoenolpyruvate (PEP)</text>
<text x="270" y="803" text-anchor="middle" font-size="10" fill="#546e7a">-H2O</text>
<line x1="340" y1="809" x2="340" y2="833" stroke="#90a4ae" stroke-width="2" marker-end="url(#arr-green)"/>
<rect x="355" y="813" width="100" height="17" rx="4" fill="white" stroke="#b0bec5" stroke-width="1"/>
<text x="405" y="826" text-anchor="middle" font-size="10" fill="#37474f" font-style="italic">Enolase</text>
<rect x="90" y="834" width="480" height="38" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
<circle cx="118" cy="854" r="13" fill="#66bb6a"/>
<text x="118" y="859" text-anchor="middle" font-size="12" font-weight="700" fill="white"></text>
<text x="270" y="851" text-anchor="middle" font-size="13" font-weight="600" fill="#212121">Pyruvate (x2)</text>
<text x="270" y="867" text-anchor="middle" font-size="10" fill="#546e7a">+2 ATP</text>
<line x1="40" y1="530" x2="640" y2="530" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="8,4"/>
<text x="340" y="527" text-anchor="middle" font-size="10" fill="#757575">↓ each G3P continues independently (x2) ↓</text>
<rect x="60" y="884" width="560" height="118" rx="10" fill="white" stroke="#2e7d5e" stroke-width="2"/>
<rect x="60" y="884" width="560" height="28" rx="10" fill="#2e7d5e"/>
<rect x="60" y="898" width="560" height="14" rx="0" fill="#2e7d5e"/>
<text x="340" y="903" text-anchor="middle" font-size="13" font-weight="600" fill="white">Net Yield per Glucose Molecule</text>
<text x="340" y="930" text-anchor="middle" font-size="13" fill="#212121" font-weight="500">Glucose + 2 NAD+ + 2 ADP + 2 Pi</text>
<text x="340" y="948" text-anchor="middle" font-size="13" fill="#546e7a">↓</text>
<text x="340" y="966" text-anchor="middle" font-size="13" fill="#212121" font-weight="500">2 Pyruvate + 2 NADH + 2 ATP + 2 H2O</text>
<text x="340" y="990" text-anchor="middle" font-size="11" fill="#6c757d">Only 5% of glucose energy captured — Krebs cycle captures the rest</text>
</svg>