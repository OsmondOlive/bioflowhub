<svg width="680" height="250" viewBox="0 0 680 250" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Cellular energy sensing via AMPK and PFK-1</title>
<desc>Diagram comparing two cellular energy states: low energy with high AMP and ADP, which activates AMPK and PFK-1 and turns glycolysis on, versus high energy with high ATP and citrate, which inhibits PFK-1 and slows glycolysis.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect x="90" y="40" width="220" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="200" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Low energy</text>
<text x="200" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">High AMP, ADP</text>

<rect x="370" y="40" width="220" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="480" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">High energy</text>
<text x="480" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">High ATP, citrate</text>

<line x1="200" y1="96" x2="200" y2="150" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="480" y1="96" x2="480" y2="150" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="90" y="150" width="220" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="200" y="172" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">PFK-1 + AMPK active</text>
<text x="200" y="190" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">Glycolysis turns on</text>

<rect x="370" y="150" width="220" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="480" y="172" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">PFK-1 inhibited</text>
<text x="480" y="190" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Glycolysis slows down</text>
</svg>
