<svg viewBox="0 0 820 415" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <rect width="820" height="415" fill="#f8faf9" rx="12"/>
  <text x="410" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2e2a">The Hierarchy of Evidence</text>
  <text x="410" y="54" text-anchor="middle" font-size="11" fill="#666">Each level provides stronger grounds for causal conclusions than the one below it</text>

  <!-- Level 5: Meta-analyses — TRUE pointed apex -->
  <polygon points="315,145 505,145 410,72" fill="#4caf50" stroke="#1b5e20" stroke-width="2"/>
  <text x="410" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">Meta-analyses of RCTs</text>
  <text x="410" y="128" text-anchor="middle" font-size="10" fill="#1b5e20">Strongest available evidence</text>

  <!-- Level 4: Systematic Reviews -->
  <polygon points="265,200 555,200 505,145 315,145" fill="#a5d6a7" stroke="#2e7b32" stroke-width="1.5"/>
  <text x="410" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">Systematic Reviews</text>
  <text x="410" y="184" text-anchor="middle" font-size="10" fill="#1b5e20">Pooling multiple studies — reduces random error</text>

  <!-- Level 3: RCTs -->
  <polygon points="215,260 605,260 555,200 265,200" fill="#fff9c4" stroke="#f57f17" stroke-width="1.5"/>
  <text x="410" y="227" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">Randomized Controlled Trials (RCTs)</text>
  <text x="410" y="243" text-anchor="middle" font-size="10" fill="#e65100">Gold standard for causation — controls for confounders</text>

  <!-- Level 2: Observational -->
  <polygon points="165,320 655,320 605,260 215,260" fill="#ffe0b2" stroke="#e65100" stroke-width="1.5"/>
  <text x="410" y="287" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">Observational Studies</text>
  <text x="410" y="303" text-anchor="middle" font-size="10" fill="#e65100">Cohort, case-control — can show associations, not causation</text>

  <!-- Level 1: Anecdote -->
  <polygon points="110,382 710,382 655,320 165,320" fill="#ffcdd2" stroke="#e53935" stroke-width="1.5"/>
  <text x="410" y="347" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">Anecdote and Case Reports</text>
  <text x="410" y="363" text-anchor="middle" font-size="10" fill="#c62828">One person's experience — suggestive, not conclusive</text>

  <!-- Left arrow -->
  <line x1="85" y1="375" x2="85" y2="85" stroke="#2e7d5e" stroke-width="2" marker-end="url(#upArrow)"/>
  <defs><marker id="upArrow" markerWidth="8" markerHeight="8" refX="4" refY="8" orient="auto"><path d="M0,8 L4,0 L8,8 Z" fill="#2e7d5e"/></marker></defs>
  <text x="78" y="240" text-anchor="middle" font-size="10" fill="#2e7d5e" transform="rotate(-90,78,240)">Strength of evidence</text>

  <!-- Info box -->
  <rect x="600" y="72" width="200" height="130" rx="8" fill="#f0f9f4" stroke="#2e7d5e" stroke-width="1"/>
  <text x="700" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2e2a">First question to ask:</text>
  <text x="700" y="110" text-anchor="middle" font-size="10" fill="#333">What type of study</text>
  <text x="700" y="124" text-anchor="middle" font-size="10" fill="#333">is this claim based on?</text>
  <line x1="618" y1="134" x2="782" y2="134" stroke="#c8e6c9" stroke-width="1"/>
  <text x="700" y="152" text-anchor="middle" font-size="10" fill="#555">A single observational study</text>
  <text x="700" y="166" text-anchor="middle" font-size="10" fill="#555">and a meta-analysis of RCTs</text>
  <text x="700" y="180" text-anchor="middle" font-size="10" fill="#555">are not equivalent evidence.</text>

  <text x="410" y="400" text-anchor="middle" font-size="9.5" fill="#aaa">bioflowhub.com</text>
</svg>
