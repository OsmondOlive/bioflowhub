<text x="440" y="40" text-anchor="middle" font-size="21" font-weight="600" fill="#1a1a2e">The Krebs Cycle (TCA Cycle)</text>
<text x="440" y="62" text-anchor="middle" font-size="12" fill="#6c757d">8 reactions in the mitochondrial matrix. 2 turns per glucose molecule.</text>
<line x1="80" y1="74" x2="800" y2="74" stroke="#dee2e6" stroke-width="1"/>
<circle cx="440" cy="435" r="84" fill="white" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="440" y="405" text-anchor="middle" font-size="12" font-weight="600" fill="#37474f">Krebs Cycle</text>
<text x="440" y="425" text-anchor="middle" font-size="12" font-weight="400" fill="#546e7a">per turn:</text>
<text x="440" y="447" text-anchor="middle" font-size="12" font-weight="600" fill="#1b5e20">3 NADH + 1 FADH2</text>
<text x="440" y="465" text-anchor="middle" font-size="12" font-weight="600" fill="#0d47a1">1 GTP + 2 CO2</text>
<text x="440" y="485" text-anchor="middle" font-size="12" font-weight="400" fill="#9e9e9e">(per half-glucose)</text>
<path d="M440.0,183.0 Q513.1,258.6 618.2,256.8" stroke="#5c35d1" stroke-width="2.5" fill="none" marker-end="url(#a0)"/>
<text x="574.7" y="109.8" text-anchor="middle" font-size="10" fill="#5c35d1" font-style="italic">Citrate synthase</text>
<rect x="522.7" y="144.2" width="68" height="18" rx="5" fill="#ede7f6" stroke="#5c35d1" stroke-width="1.2"/>
<text x="556.7" y="158.2" text-anchor="middle" font-size="10" font-weight="600" fill="#5c35d1">+CoA</text>
<path d="M618.2,256.8 Q616.4,361.9 692.0,435.0" stroke="#1976d2" stroke-width="2.5" fill="none" marker-end="url(#a1)"/>
<text x="765.2" y="300.3" text-anchor="middle" font-size="10" fill="#1976d2" font-style="italic">Aconitase</text>
<path d="M692.0,435.0 Q616.4,508.1 618.2,613.2" stroke="#00796b" stroke-width="2.5" fill="none" marker-end="url(#a2)"/>
<text x="765.2" y="562.7" text-anchor="middle" font-size="10" fill="#00796b" font-style="italic">Isocitrate</text>
<text x="765.2" y="576.7" text-anchor="middle" font-size="10" fill="#00796b" font-style="italic">dehydrogenase</text>
