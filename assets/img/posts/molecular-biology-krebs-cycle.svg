<rect x="554.2" y="238.8" width="128" height="36" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
<text x="618.2" y="254.8" text-anchor="middle" font-size="11" font-weight="600" fill="#1976d2">Citrate</text>
<text x="618.2" y="270.8" text-anchor="middle" font-size="9" fill="#546e7a">Citrate</text>
