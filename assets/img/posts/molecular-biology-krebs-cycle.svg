<text x="114.8" y="576.7" text-anchor="middle" font-size="10" fill="#c62828" font-style="italic">dehydrogenase</text>
<rect x="124.2" y="542.7" width="68" height="18" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="1.2"/>
<text x="158.2" y="556.7" text-anchor="middle" font-size="10" font-weight="600" fill="#c62828">+FADH2</text>
