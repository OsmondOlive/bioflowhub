<text x="440.0" y="685.0" text-anchor="middle" font-size="11" font-weight="600" fill="#f57c00">Succinyl-CoA</text>
<text x="440.0" y="701.0" text-anchor="middle" font-size="9" fill="#546e7a">Suc-CoA</text>
<rect x="197.8" y="595.2" width="128" height="36" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<text x="261.8" y="611.2" text-anchor="middle" font-size="11" font-weight="600" fill="#c62828">Succinate</text>
<text x="261.8" y="627.2" text-anchor="middle" font-size="9" fill="#546e7a">Succinate</text>
<rect x="124.0" y="417.0" width="128" height="36" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
<text x="188.0" y="433.0" text-anchor="middle" font-size="11" font-weight="600" fill="#6a1b9a">Fumarate</text>
<text x="188.0" y="449.0" text-anchor="middle" font-size="9" fill="#546e7a">Fumarate</text>
<rect x="197.8" y="238.8" width="128" height="36" rx="8" fill="#e1f5fe" stroke="#0288d1" stroke-width="2"/>
<text x="261.8" y="254.8" text-anchor="middle" font-size="11" font-weight="600" fill="#0288d1">Malate</text>
<text x="261.8" y="270.8" text-anchor="middle" font-size="9" fill="#546e7a">Malate</text>
<text x="728.19090885901" y="201.80909114099006" font-size="12" font-weight="700" fill="#e65100" text-anchor="middle">Acetyl-CoA</text>
<text x="728.19090885901" y="218.80909114099006" font-size="10" fill="#ef6c00" text-anchor="middle">(from pyruvate)</text>
<line x1="728.19090885901" y1="228.80909114099006" x2="682.2" y2="252.8" stroke="#e65100" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#aCoA)"/>
<rect x="40" y="840" width="800" height="80" rx="10" fill="white" stroke="#2e7d5e" stroke-width="2"/>
<rect x="40" y="840" width="800" height="28" rx="10" fill="#2e7d5e"/>
<rect x="40" y="854" width="800" height="14" rx="0" fill="#2e7d5e"/>
<text x="440" y="859" text-anchor="middle" font-size="13" font-weight="600" fill="white">Per Glucose (2 turns): 6 NADH + 2 FADH2 + 2 GTP + 4 CO2</text>
<text x="440" y="886" text-anchor="middle" font-size="12" fill="#37474f">NADH and FADH2 carry electrons to the electron transport chain,</text>
<text x="440" y="904" text-anchor="middle" font-size="12" fill="#546e7a">where oxidative phosphorylation produces the majority of cellular ATP.</text>
</svg>