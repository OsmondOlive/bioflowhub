<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="100%" height="100%">
  <defs>
    <style>
      .leaf-breathe { transform-origin: 62px 110px; animation: breathe 4s ease-in-out infinite; }
      @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.03)} }
      .vein-flow { stroke-dasharray:50; stroke-dashoffset:50; animation:vf 3s ease-in-out infinite; }
      .vein-flow-2 { stroke-dasharray:35; stroke-dashoffset:35; animation:vf 3s ease-in-out 0.6s infinite; }
      .vein-flow-3 { stroke-dasharray:28; stroke-dashoffset:28; animation:vf 3s ease-in-out 1.1s infinite; }
      @keyframes vf { 0%{stroke-dashoffset:50;opacity:0} 25%{opacity:1} 100%{stroke-dashoffset:-50;opacity:0} }
      .cp1 { animation:cp 3s ease-in-out infinite; }
      .cp2 { animation:cp 3s ease-in-out 1s infinite; }
      .cp3 { animation:cp 3s ease-in-out 2s infinite; }
      @keyframes cp { 0%{stroke-dashoffset:70;opacity:0} 20%{opacity:1} 100%{stroke-dashoffset:-70;opacity:0} }
      .dg1 { animation:dg 3s ease-in-out infinite; }
      .dg2 { animation:dg 3s ease-in-out 1s infinite; }
      .dg3 { animation:dg 3s ease-in-out 2s infinite; }
      @keyframes dg { 0%,55%{r:5;opacity:0.25} 80%{r:7;opacity:1} 100%{r:5;opacity:0.25} }
      .gp { animation:gpa 4s ease-in-out infinite; }
      @keyframes gpa { 0%,100%{opacity:0.15} 50%{opacity:0.5} }
    </style>
    <linearGradient id="lg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52b788"/>
      <stop offset="100%" stop-color="#2e7d5e"/>
    </linearGradient>
    <linearGradient id="lg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52b788"/>
      <stop offset="100%" stop-color="#40a0c8"/>
    </linearGradient>
    <linearGradient id="lg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52b788"/>
      <stop offset="50%" stop-color="#3a9d7a"/>
      <stop offset="100%" stop-color="#40a0c8"/>
    </linearGradient>
    <radialGradient id="glowR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#52b788" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#52b788" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="110" cy="110" r="100" fill="url(#glowR)" class="gp"/>
  <g class="leaf-breathe">
    <path d="M62,55 C42,70 32,95 36,120 C40,142 55,158 68,162 C65,140 67,118 75,100 C79,91 85,82 90,75" fill="url(#lg1)" opacity="0.92"/>
    <path d="M90,75 C85,82 79,91 75,100 C67,118 65,140 68,162 C62,158 50,148 44,132 C36,110 38,82 55,65 Z" fill="url(#lg1)" opacity="0.7"/>
    <path d="M68,162 L90,75" stroke="#1a3d2b" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
    <path d="M80,140 C70,134 58,132 50,132" stroke="#1a3d2b" stroke-width="1" fill="none" opacity="0.25"/>
    <path d="M77,122 C67,116 56,113 48,112" stroke="#1a3d2b" stroke-width="1" fill="none" opacity="0.25"/>
    <path d="M74,104 C65,99 56,96 50,95" stroke="#1a3d2b" stroke-width="1" fill="none" opacity="0.25"/>
    <path d="M68,162 L90,75" stroke="#74c69d" stroke-width="2.5" fill="none" stroke-linecap="round" class="vein-flow"/>
    <path d="M80,140 C70,134 58,132 50,132" stroke="#74c69d" stroke-width="1.5" fill="none" class="vein-flow-2"/>
    <path d="M77,122 C67,116 56,113 48,112" stroke="#74c69d" stroke-width="1.5" fill="none" class="vein-flow-3"/>
  </g>
  <line x1="95" y1="58" x2="95" y2="162" stroke="url(#lg3)" stroke-width="13" stroke-linecap="round"/>
  <path d="M95,58 C95,58 130,58 133,75 C136,90 122,100 95,100" fill="none" stroke="url(#lg3)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M95,100 C95,100 134,100 137,120 C140,138 124,162 95,162" fill="none" stroke="url(#lg3)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="137" y1="80" x2="178" y2="80" stroke="url(#lg2)" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="137" y1="110" x2="172" y2="110" stroke="url(#lg2)" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="137" y1="140" x2="178" y2="140" stroke="url(#lg2)" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="182" cy="80" r="5" fill="#40a0c8" opacity="0.3"/>
  <circle cx="176" cy="110" r="5" fill="#40a0c8" opacity="0.3"/>
  <circle cx="182" cy="140" r="5" fill="#40a0c8" opacity="0.3"/>
  <line x1="137" y1="80" x2="178" y2="80" stroke="#74c69d" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="70" stroke-dashoffset="70" class="cp1"/>
  <line x1="137" y1="110" x2="172" y2="110" stroke="#74c69d" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="70" stroke-dashoffset="70" class="cp2"/>
  <line x1="137" y1="140" x2="178" y2="140" stroke="#74c69d" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="70" stroke-dashoffset="70" class="cp3"/>
  <circle cx="182" cy="80" r="5" fill="#74c69d" class="dg1"/>
  <circle cx="176" cy="110" r="5" fill="#74c69d" class="dg2"/>
  <circle cx="182" cy="140" r="5" fill="#74c69d" class="dg3"/>
</svg>
